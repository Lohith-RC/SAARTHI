version: '3.8'

services:
  saarthi-cloud:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saarthi-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - SAARTHI_DEVICE_TOKEN=${SAARTHI_DEVICE_TOKEN:-SAARTHI_UUID4_MASTER_SECRET}
      - SAARTHI_ENFORCE_TOKEN=true
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/api/v1/telemetry/current || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
