# =====================================================================
# SAARTHI reverse-proxy reference (Nginx) — TLS termination at the edge.
#
# The Spring Boot app binds loopback only (SERVER_ADDRESS=127.0.0.1) by
# default. This proxy terminates TLS and forwards to the private backend,
# so the app is never directly exposed on a public interface.
#
# Place under /etc/nginx/sites-available/saarthi and symlink into
# /etc/nginx/sites-enabled. Obtain certs with certbot.
# =====================================================================

server {
    listen 80;
    server_name saarthi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saarthi.example.com;

    ssl_certificate     /etc/letsencrypt/live/saarthi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saarthi.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Hardening headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: ws: wss:" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Body size limits mirror the app's own Tomcat limits
    client_max_body_size 256k;

    # WebSocket upgrade for the live HUD stream
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # REST API, Actuator and HUD
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}