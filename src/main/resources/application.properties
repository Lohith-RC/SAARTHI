# ===================================================================
# SAARTHI: Java 17/21 + Spring Boot 3.x Application Configuration
# ===================================================================

server.port=${SERVER_PORT:8080}
spring.application.name=saarthi-backend

# H2 In-Memory Database & Persistence
spring.datasource.url=jdbc:h2:mem:saarthidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static Resource Handling (Serving 3D WebGL HUD)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.com.saarthi=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=INFO

# AI & Voice Engine Configuration (Read securely from .env or System Environment)
saarthi.ai.groq.api-key=${GROQ_API_KEY:}
saarthi.ai.groq.default-model=deepseek-r1-distill-llama-70b
saarthi.ai.gemini.api-key=${GEMINI_API_KEY:}
saarthi.ai.gemini.default-model=gemini-2.0-flash
saarthi.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
saarthi.ai.elevenlabs.default-voice-id=${ELEVENLABS_DEFAULT_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}

saarthi.device.default-token=${SAARTHI_DEVICE_TOKEN:SAARTHI_UUID4_MASTER_SECRET}
