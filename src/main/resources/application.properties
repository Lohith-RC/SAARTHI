# ===================================================================
# SAARTHI: Java 21 + Spring Boot 3.x Application Configuration
# ===================================================================

server.port=${SERVER_PORT:8080}
# Safe default: bind loopback only. Terminate TLS at a reverse proxy and bind
# the public interface explicitly via SERVER_ADDRESS=0.0.0.0 only behind TLS.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Honor X-Forwarded-For/Proto/Host set by the TLS-terminating reverse proxy.
server.forward-headers-strategy=framework
spring.application.name=saarthi-backend

# ===================================================================
# Database Configuration (Supabase Cloud PostgreSQL / Persistent Fallback)
# Set via .env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# When set to Supabase (jdbc:postgresql://...), it connects to Supabase seamlessly!
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/saarthi;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:saarthi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Fail fast if the entity mapping drifts from the Flyway-managed schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cloud Database / Supabase Connection Pooler Tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Static Resource Handling (Serving 3D WebGL HUD)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Tomcat Request Size Limits (DoS hardening)
server.tomcat.max-http-post-size=262144
server.tomcat.max-http-form-post-size=262144
server.tomcat.max-http-response-header-size=8192

# Logging Configuration
logging.level.com.saarthi=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.security=INFO
# Structured JSON logging is the default (logback-spring.xml). For local
# development use human-readable console logs: SPRING_PROFILES_ACTIVE=console.
logging.level.SECURITY_AUDIT=INFO

# AI & Voice Engine Configuration (Read securely from .env or System Environment)
saarthi.ai.groq.api-key=${GROQ_API_KEY:}
saarthi.ai.groq.default-model=openai/gpt-oss-120b
saarthi.ai.gemini.api-key=${GEMINI_API_KEY:}
saarthi.ai.gemini.default-model=gemini-3.6-flash
saarthi.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:}
saarthi.ai.elevenlabs.default-voice-id=${ELEVENLABS_DEFAULT_VOICE_ID:JBFqnCBsd6RMkjVDRZzb}
# Customer-supplied AI API keys are disabled by default (server-side keys only)
saarthi.ai.customer-api-keys-enabled=${SAARTHI_CUSTOMER_AI_KEYS:false}

# Security: Device & Operator Tokens (MUST be supplied; there is NO public default)
saarthi.security.device-token=${SAARTHI_DEVICE_TOKEN:}
saarthi.security.operator-token=${SAARTHI_OPERATOR_TOKEN:}
saarthi.security.enforce-token=${SAARTHI_ENFORCE_TOKEN:true}

# Alert Webhook
saarthi.alert.webhook-url=${ALERT_WEBHOOK_URL:}
saarthi.alert.min-interval-seconds=60
saarthi.alert.allow-private-webhooks=${ALLOW_PRIVATE_WEBHOOKS:false}

# Concurrency & Performance: Virtual Threads (Java 21+)
spring.threads.virtual.enabled=true

# CORS Allowed Origins (single source of truth; do NOT set to * with credentials)
saarthi.cors.allowed-origins=${SAARTHI_CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Actuator (health/metrics) behind operator authentication
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

