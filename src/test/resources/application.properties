# ===================================================================
# Test Environment Configuration (Isolated In-Memory Test Database)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:saarthitestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.show-sql=false

# Test-only unique secrets (never the deprecated public constant)
saarthi.security.device-token=test-device-token-abc123
saarthi.security.operator-token=test-operator-token-def456
saarthi.security.enforce-token=true
saarthi.alert.webhook-url=
saarthi.alert.min-interval-seconds=60
saarthi.alert.allow-private-webhooks=true
saarthi.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

